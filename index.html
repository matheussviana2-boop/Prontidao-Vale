<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prontidão · Operação Vale · Univale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --brand:#00928a;--brand2:#22c0b0;--brand-ink:#00706a;
  --bg:#eef4f4;--grid:rgba(0,146,138,.06);
  --surface:#ffffff;--surface2:#f2f7f7;--line:#d5e3e2;--text:#0f2a2a;--muted:#5b7473;
  --red:#d92d20;--red-bg:#fde3e0;--red-l:#f3b3ad;
  --orange:#c4570a;--orange-bg:#feead6;--orange-l:#f4c69b;
  --amber:#9a6400;--amber-bg:#fdf2c9;--amber-l:#ead48a;
  --green:#0b8a5a;--green-bg:#ddf3e8;--green-l:#a8dcc2;
  --gray:#6b7787;--gray-bg:#eef0f3;
  --track:#d3dfde;--shadow:0 1px 2px rgba(0,60,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--text);font:13px/1.35 Inter,system-ui,sans-serif;background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font-family:inherit}

/* ---------- topo (uma linha, como painel de operação) ---------- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--surface);border-bottom:2px solid var(--brand);box-shadow:0 2px 10px rgba(0,60,60,.06);flex-wrap:wrap}
.logo{display:flex;align-items:center}
.logo img{height:38px;display:block}
.top .tit{border-left:1px solid var(--line);padding-left:12px}
.tit h1{margin:0;font:italic 800 18px "Exo 2",sans-serif;color:var(--brand-ink);white-space:nowrap}
.tit h1 span{color:var(--text);font-style:normal;font-weight:700}
.tit p{margin:0;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
.pill{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px 3px 9px;font:600 12px Inter,sans-serif;color:var(--muted);cursor:pointer}
.pill b{font:800 19px "Exo 2",sans-serif;color:var(--c)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pill[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset;color:var(--text)}
.ctl{display:flex;gap:6px;align-items:center}
input[type=search],select{font:12.5px Inter,sans-serif;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
input[type=search]{width:220px}
.live{display:flex;align-items:center;gap:7px;font:700 11px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--brand);border:1px solid var(--line);background:var(--surface);padding:4px 9px;border-radius:999px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--brand2);animation:ping 1.6s infinite}
.live.off{color:var(--red)} .live.off i{background:var(--red);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,192,176,.7)}100%{box-shadow:0 0 0 8px rgba(34,192,176,0)}}
.clock{text-align:right;border-left:1px solid var(--line);padding-left:12px}
.clock b{font:700 26px "JetBrains Mono",monospace;line-height:1;display:block}
.clock small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 9px;cursor:pointer;font:700 12px Inter,sans-serif;white-space:nowrap}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}

.sub{display:flex;align-items:center;gap:6px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.tab{font:600 13px Inter,sans-serif;background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:7px 12px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--brand-ink);border-bottom-color:var(--brand)}
.sub .sp{flex:1}
.info{font-size:11.5px;color:var(--muted)}
.info a{color:var(--brand-ink);font-weight:700}

.msg{margin:8px 14px 0;padding:8px 12px;border-radius:8px;background:var(--red-bg);color:var(--red);font-weight:700}
.corpo{padding:6px 12px 24px}

/* ---------- setores e cards ---------- */
.sec{margin-top:8px}
.sec h3{margin:0 0 5px;font:italic 800 14px "Exo 2",sans-serif;color:var(--brand-ink);display:flex;gap:10px;align-items:center;text-transform:uppercase;letter-spacing:.03em}
.sec h3 small{font:600 11px Inter,sans-serif;color:var(--muted);text-transform:none;letter-spacing:0;font-style:normal}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.c{border-radius:7px;padding:5px 8px 6px;border:1px solid var(--tl);background:var(--tb);display:flex;flex-direction:column;gap:1px;min-width:0}
.c .a{display:flex;align-items:flex-start;gap:6px;min-width:0}
.c .nm{font-weight:800;font-size:12.5px;flex:1;min-width:0;line-height:1.25;color:#0b1f1f;overflow-wrap:anywhere}
.c .vel{display:flex;align-items:center;gap:3px;font:700 11.5px "JetBrains Mono",monospace;white-space:nowrap;margin-top:1px}
.c .vel.on{color:#0b1f1f} .c .vel.off{color:#4f6665}
.c .ign{display:inline-flex}
.c .ign svg{width:12px;height:12px}
.c .ign.on{color:#067a4c} .c .ign.off{color:#7c9291}
.c .b{font-size:11.5px;color:#2b4443}
.c .b b{font:700 11.5px "JetBrains Mono",monospace;color:#0b1f1f}
.c .ln{font-size:11.5px;color:#1c3534;overflow-wrap:anywhere}
.c .ln b{font:700 11.5px "JetBrains Mono",monospace;color:#0b1f1f}
.c .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:auto;padding-top:3px;border-top:1px dashed var(--tl)}
.c .t .lb{font:800 11px Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--k)}
.c .t b{font:700 12px "JetBrains Mono",monospace;color:var(--k);white-space:nowrap}
.c .h{font-size:11px;color:#2b4443}
.c .tx{font-size:11px;color:#2b4443}
.c .tx b{font:700 11px "JetBrains Mono",monospace;color:#0b1f1f}
.c .tx.atr,.c .tx.atr b{color:#b42318;font-weight:700}
.c.INAPTO,.c.VENCIDO{--tb:#fbd3ce;--tl:#ee9a91;--k:#a8190f}
.c.SEM_TESTE{--tb:var(--orange-bg);--tl:var(--orange-l);--k:#a34507}
.c.VENCENDO{--tb:var(--amber-bg);--tl:var(--amber-l);--k:#7a4f00}
.c.OK{--tb:var(--green-bg);--tl:var(--green-l);--k:#066b43}
.c.crit{border:2px solid var(--red);padding:4px 7px 5px;animation:alerta 1.4s infinite}
@keyframes alerta{0%,100%{box-shadow:0 0 0 0 rgba(217,45,32,.45)}50%{box-shadow:0 0 0 4px rgba(217,45,32,0)}}
.empty{padding:28px;text-align:center;color:var(--muted)}
.nota{font-size:11px;color:var(--muted);margin-top:10px}

/* ---------- viagens finalizadas ---------- */
.stats{display:flex;gap:6px;flex-wrap:wrap}
.bar2{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0}
.busca{position:relative;display:flex;align-items:center}
.busca svg{position:absolute;left:10px;width:15px;height:15px;color:var(--muted);pointer-events:none}
.busca input{width:360px;max-width:100%;font-size:13.5px;padding:8px 10px 8px 32px;border:1px solid #b9cfcd;border-radius:9px;background:#fff}
.busca input:focus{outline:2px solid var(--brand);outline-offset:-1px}
body.tv .bar2{display:none}
.tblc{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr td:first-child{box-shadow:inset 4px 0 var(--k)}
.badge{font:800 10px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--kb);color:var(--k);white-space:nowrap}
.obs{font-size:11px;color:var(--k);font-weight:600;margin-top:3px}

/* ---------- modo TV: tela cheia, só os cards ---------- */
body.tv .sub,body.tv .ctl,body.tv #btv{display:none}
body:not(.tv) #sairtv{display:none}
@media (prefers-reduced-motion:reduce){.live i,.c.crit{animation:none}}
@media (max-width:1100px){.tit p{display:none}}
</style>
</head>

<script>
/* ===== CONFIGURAÇÃO DO PAINEL ONLINE ===== */
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzl19qpxppGY4FB5scTyG5GiOAwKJjsPt_tMHwAlNRGhaqocNT8PjGXEtNWUCq4QYUK/exec';   // URL do App da Web do Backend (termina em /exec)
/* ========================================= */
var API=(function(){
  var CHAVE=new URLSearchParams(location.search).get('k')||'';
  var cache=null,em=0,pend=null,lag=null,lagEm=0;
  function buscar(){
    if(cache&&Date.now()-em<20000) return Promise.resolve(cache);
    if(pend) return pend;
    pend=fetch(BACKEND_URL+(CHAVE?'?k='+encodeURIComponent(CHAVE):'')).then(function(r){return r.json();}).then(function(j){
      pend=null; if(j.erro) throw new Error(j.erro);
      cache=j; em=Date.now();
      lag=j.agoraRecebidoEm?(j.servidorEm-j.agoraRecebidoEm):null; lagEm=Date.now();
      return j;
    },function(e){pend=null;throw new Error('Não foi possível buscar os dados ('+e.message+').');});
    return pend;
  }
  return {
    agora:function(){return buscar().then(function(j){if(!j.agora) throw new Error('Ainda não chegaram dados do coletor.');return j.agora;});},
    dia:function(){return buscar().then(function(j){return j.dia;});},
    atraso:function(){return lag==null?(em?999:null):Math.round((lag+Date.now()-lagEm)/60000);}
  };
})();

</script>

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function dur(m){m=Math.max(0,Math.round(m));var h=Math.floor(m/60),r=m%60;return h?h+'h'+String(r).padStart(2,'0'):r+'min';}
function hora(s){return s?String(s).slice(-5):'';}
function erro(e){$('msg').innerHTML='<div class="msg">'+esc(e&&e.message||e)+'</div>';}


/* abas */
function aba(n){
  ABA=n;
  $('pills').style.visibility=n==='agora'?'':'hidden';
  $('v-agora').style.display=n==='agora'?'':'none'; $('v-dia').style.display=n==='dia'?'':'none';
  $('t-agora').setAttribute('aria-selected',n==='agora'); $('t-dia').setAttribute('aria-selected',n==='dia');
  if(n==='dia'&&!D2) carregar2(); else if(n==='dia') tela2();
  tela1();
}
$('t-agora').onclick=function(){aba('agora');}; $('t-dia').onclick=function(){aba('dia');};

function preencherBases(sel,D){
  var atual=sel.value,b={};(D||[]).forEach(function(l){if(l.base)b[l.base]=1;});
  sel.innerHTML='<option value="">Todas as bases</option>'+Object.keys(b).sort().map(function(x){return '<option'+(x===atual?' selected':'')+'>'+esc(x)+'</option>';}).join('');
}

/* ---------- Tela 1: rodando agora ---------- */
function carregar1(){
  API.agora().then(function(r){D1=r;rec1=Date.now();$('msg').innerHTML='';tela1();})
    .catch(erro);
}
function vence(l){return l.venceMin==null?null:l.venceMin-(Date.now()-rec1)/60000;}
/* Sem teste = nenhum teste registrado no Prontos; Teste vencido = fez teste, mas a validade já passou */
function catV(l){return l.cat==='SEM_TESTE'&&/vencid/i.test(l.detalhe||'')?'VENCIDO':l.cat;}
function situacao(l){return l.cat==='OK'&&l.venceMin!=null&&vence(l)<=120?'VENCENDO':catV(l);}
function critico(l){var s=situacao(l);return (s==='INAPTO'||s==='VENCIDO'||s==='SEM_TESTE')&&l.veloc>0;}
var IGN='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 1.8v6"/><path d="M4.3 4.3a5.3 5.3 0 1 0 7.4 0"/></svg>';
function norm(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function acha(q,txt){if(!q)return true;var t=norm(txt);return q.split(/\s+/).every(function(p){p=norm(p);return !p||t.indexOf(p)>=0;});}
function hd(x){if(!x)return '—';var d=new Date(),h=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');return String(x).slice(0,5)===h?String(x).slice(-5):String(x);}
function rotulo(l){
  var s=situacao(l);
  if(s==='INAPTO') return 'Inapto';
  if(s==='VENCIDO') return 'Teste vencido';
  if(s==='SEM_TESTE') return 'Sem teste';
  return 'Teste OK';
}
function card(l){
  var s=situacao(l), v='';
  if(s==='INAPTO') v='não liberado';
  else if((s==='OK'||s==='VENCENDO')&&l.venceMin!=null) v='vence '+dur(vence(l));
  var cls=s;
  return '<div class="c '+cls+(critico(l)?' crit':'')+'">'+
    '<div class="a"><span class="nm">'+esc(l.nome||l.motoristaICS)+'</span>'+
      '<span class="ign '+(l.ign?'on':'off')+'" title="Ignição '+(l.ign?'ligada':'desligada')+'">'+IGN+'</span>'+
      '<span class="vel '+(l.veloc>0?'on':'off')+'">'+(l.veloc||0)+' km/h</span></div>'+
    '<div class="b">Matrícula <b>'+esc(l.matricula)+'</b></div>'+
    '<div class="ln">Carro <b>'+esc(l.frota||'—')+'</b>'+(l.linha?' · '+esc(l.linha):'')+'</div>'+
    '<div class="tx'+(l.transMin>=15?' atr':'')+'"'+(l.transMin>=15?' title="Sem transmitir há '+dur(l.transMin)+'"':'')+'>Transmissão <b>'+esc(l.transmissao||'—')+'</b>'+'</div>'+
    '<div class="t"><span class="lb">'+rotulo(l)+'</span><b>'+v+'</b></div>'+
    (l.teste?'<div class="h">Teste '+esc(cls==='OK'||cls==='VENCENDO'?hd(l.teste):l.teste)+' → '+esc(cls==='OK'||cls==='VENCENDO'?hd(l.validade):(l.validade||'—'))+'</div>':'')+
  '</div>';
}
var FILTROS=[['TODOS','Logados','var(--brand)'],['MOV','Em movimento','var(--brand)'],['INAPTO','Inapto','var(--red)'],['VENCIDO','Teste vencido','var(--red)'],['SEM_TESTE','Sem teste','var(--orange)'],['VENCENDO','Vence ≤ 2 h','var(--amber)']];
function filtrar(f){F1=(F1===f?'TODOS':f);if(ABA!=='agora')aba('agora');else tela1();}
function passa(l,f){return f==='TODOS'||(f==='MOV'?l.veloc>0:situacao(l)===f);}
function ordenar(a,b){
  return ORD[situacao(a)]-ORD[situacao(b)]||(b.veloc>0?1:0)-(a.veloc>0?1:0)||(b.ign?1:0)-(a.ign?1:0)||
    ((vence(a)==null?1e9:vence(a))-(vence(b)==null?1e9:vence(b)))||String(a.nome||a.motoristaICS).localeCompare(String(b.nome||b.motoristaICS));
}
function tela1(){
  if(!D1) return;
  var todas=D1.linhas.filter(function(l){return ORD[l.cat]!=null;});
  preencherBases($('base1'),todas);
  var base=$('base1').value, q=$('q1').value.trim();
  var D=todas.filter(function(l){return !base||l.base===base;});
  var n=function(f){return D.filter(function(l){return passa(l,f);}).length;};
  $('pills').innerHTML=FILTROS.map(function(x){return '<button class="pill" aria-pressed="'+(F1===x[0])+'" style="--c:'+x[2]+'" onclick="filtrar(\''+x[0]+'\')"><i></i><b>'+n(x[0])+'</b>'+x[1]+'</button>';}).join('');
  var fx=FILTROS.filter(function(x){return x[0]===F1;})[0];
  $('filtroInfo').innerHTML=ABA!=='agora'?'':F1==='TODOS'?'':'Mostrando só: <b>'+fx[1]+'</b> · <a href="#" onclick="filtrar(\'TODOS\');return false">ver todos</a>';
  var vis=D.filter(function(l){
    return passa(l,F1)&&acha(q,(l.nome||'')+' '+l.motoristaICS+' '+l.matricula+' '+l.linha+' '+l.frota+' '+l.chapa);
  }).sort(ordenar);
  $('res1').textContent=q?vis.length+' encontrado(s)':'';
  var bases=[];D.forEach(function(l){var x=l.base||'Sem base';if(bases.indexOf(x)<0)bases.push(x);});bases.sort();
  $('bases').innerHTML=!D.length?'<div class="empty">Nenhum motorista logado.</div>':bases.map(function(b){
    var all=D.filter(function(l){return (l.base||'Sem base')===b;}), L=vis.filter(function(l){return (l.base||'Sem base')===b;});
    if(!L.length) return '';
    var at=all.filter(function(l){return situacao(l)!=='OK';}).length;
    return '<section class="sec"><h3>'+esc(b)+' <small>'+all.length+' logados · <span style="color:'+(at?'var(--red)':'var(--green)')+';font-weight:700">'+at+' com atenção</span></small></h3>'+
      '<div class="grid">'+L.map(card).join('')+'</div></section>';
  }).join('')||'<div class="empty">Ninguém neste filtro agora.</div>';
  var ni=D1.linhas.filter(function(l){return l.cat==='NAO_IDENTIFICADO';});
  $('nota1').textContent=ni.length?ni.length+' login(s) sem matrícula identificada no cadastro não entram na contagem.':'';
}
$('q1').oninput=tela1; $('q2').oninput=tela2; $('base1').onchange=function(){tela1();if(ABA==='dia')tela2();};

/* ---------- Tela 2: viagens finalizadas ---------- */
function carregar2(){API.dia().then(function(r){D2=r;tela2();}).catch(erro);}
function tela2(){
  if(!D2) return;
  var base=$('base1').value, q=$('q2').value.trim();
  var D=D2.linhas.filter(function(l){return !base||l.base===base;});
  var n=function(c){return D.filter(function(l){return catV(l)===c;}).length;};
  var S=[['','Viagens finalizadas',D.length,'var(--brand)'],['OK','Teste OK',n('OK'),'var(--green)'],['VENCIDO','Teste vencido',n('VENCIDO'),'var(--red)'],['SEM_TESTE','Sem teste',n('SEM_TESTE'),'var(--orange)'],['INAPTO','Inapto',n('INAPTO'),'var(--red)']];
  $('stats2').innerHTML=S.map(function(x){return '<button class="pill" data-c="'+x[0]+'" aria-pressed="'+(F2===x[0])+'" style="--c:'+x[3]+'"><i></i><b>'+x[2]+'</b>'+x[1]+'</button>';}).join('')+
    '<span class="info" style="align-self:center;margin-left:8px">'+(D2.ultimaColeta?'Atualizado '+esc(D2.ultimaColeta):'')+'</span>';
  $('stats2').querySelectorAll('button').forEach(function(b){b.onclick=function(){F2=(F2===b.dataset.c?'':b.dataset.c);tela2();};});
  var rows=D.filter(function(l){
    if(F2&&catV(l)!==F2) return false;
    return acha(q,l.motorista+' '+l.matricula+' '+l.linha+' '+l.itinerario+' '+l.frota);
  }).sort(function(a,b){var x=ORD[catV(a)],y=ORD[catV(b)];return (x==null?9:x)-(y==null?9:y);});
  $('g2').innerHTML=!rows.length?'<div class="empty">'+(D2.linhas.length?'Nenhuma viagem com esse filtro.':'Nenhuma viagem finalizada gravada hoje.')+'</div>':
    '<table><thead><tr><th>Teste</th><th>Motorista</th><th>Viagem</th><th>Veículo</th><th>Partida</th><th>Chegada</th><th>Teste do motorista</th></tr></thead><tbody>'+
    rows.map(function(l){
      var cv=catV(l), k=K[cv]||K.NAO_AVALIADO;
      return '<tr style="--k:'+k[0]+';--kb:'+k[1]+'"><td><span class="badge">'+esc(LAB[cv]||cv)+'</span>'+(l.detalhe?'<div class="obs">'+esc(l.detalhe)+'</div>':'')+'</td>'+
        '<td><b>'+esc(l.motorista)+'</b><div class="muted mono" style="font-size:11px">Mat. '+esc(l.matricula)+'</div></td>'+
        '<td>'+esc(l.linha)+'<div class="muted" style="font-size:11px">'+esc(l.itinerario)+(l.sentido?' · '+esc(l.sentido):'')+(l.base?' · '+esc(l.base):'')+'</div></td>'+
        '<td class="mono">'+esc(l.frota||'—')+'</td>'+
        '<td class="mono">'+esc(l.partidaTxt||hora(l.partida)||'—')+'</td>'+
        '<td class="mono">'+esc(l.chegada||'—')+'</td>'+
        '<td class="mono">'+esc(l.teste||'—')+(l.validade?'<div class="muted" style="font-size:11px">válido até '+esc(l.validade)+'</div>':'')+'</td></tr>';
    }).join('')+'</tbody></table>';
  var na=n('NAO_AVALIADO'), notas=[];
  if(na) notas.push(na+' viagem(ns) ainda sem avaliação de teste');
  if(D2.semMotorista) notas.push(D2.semMotorista+' viagem(ns) sem motorista identificado no ICS');
  $('nota2').textContent=notas.join(' · ');
}

/* ---------- modo TV ---------- */
var rolar={pausa:0};
function modoTV(on){
  if(on&&ABA!=='agora') aba('agora');
  document.body.classList.toggle('tv',on);
  try{ if(on&&document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
       if(!on&&document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  rolar.pausa=Date.now()+10000; window.scrollTo(0,0);
}
$('btv').onclick=function(){modoTV(true);};
$('sairtv').onclick=function(){modoTV(false);};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('tv'))modoTV(false);});
/* na TV, se os cards não couberem: desce devagar, pausa no fim e volta ao topo */
setInterval(function(){
  if(!document.body.classList.contains('tv')||Date.now()<rolar.pausa) return;
  var max=document.documentElement.scrollHeight-window.innerHeight;
  if(max<=4) return;
  if(window.scrollY>=max-2){rolar.pausa=Date.now()+18000;setTimeout(function(){window.scrollTo(0,0);},8000);return;}
  window.scrollBy(0,1);
},40);
if(/[?&]tv=1/.test(location.search)) modoTV(true);

/* ---------- relógio, status e atualização ---------- */
/* A atualização é feita pelo relógio (não por contagem de segundos): com a aba em segundo plano
   o navegador desacelera os timers, e a contagem atrasava a busca — daí o falso aviso de "coletor desligado". */
var proxima=0, ultimaBusca=0;
function atualizar(){ultimaBusca=Date.now();proxima=Date.now()+SEG*1000;carregar1();if(ABA==='dia')carregar2();}
function tique(){
  var agora=new Date();
  $('clk').textContent=agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(Date.now()>=proxima){atualizar();return;}
  var at=API.atraso(), off=at!=null&&at>10;
  if(off&&Date.now()-ultimaBusca>30000){atualizar();return;}   // antes de avisar, confirma com uma busca nova
  $('live').className='live'+(off?' off':''); $('live').lastChild.textContent=off?'SEM DADOS NOVOS':'AO VIVO';
  if(off&&!$('msg').innerHTML) $('msg').innerHTML='<div class="msg">Os dados não são atualizados há '+at+' min. O coletor pode estar desligado.</div>';
  $('upd').textContent=agora.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})+(D1?' · dados '+String(D1.atualizadoEm).slice(11,16):'');
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-ultimaBusca>15000)atualizar();});
setInterval(function(){if(D1)tela1();},30000);
tique(); setInterval(tique,1000);
</script>
