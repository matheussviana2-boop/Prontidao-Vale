<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prontidão · Operação Vale · Univale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --brand:#00928a;--brand2:#22c0b0;--brand-ink:#00706a;
  --bg:#eef4f4;--grid:rgba(0,146,138,.07);--glow:rgba(34,192,176,.18);
  --surface:#ffffff;--surface2:#f2f7f7;--line:#d5e3e2;--text:#0f2a2a;--muted:#5b7473;
  --red:#d92d20;--red-bg:#fdecea;--orange:#c4570a;--orange-bg:#fff0e2;--amber:#a46a00;--amber-bg:#fff6d6;--green:#0b8a5a;--green-bg:#e3f6ee;--gray:#6b7787;--gray-bg:#eef0f3;
  --track:#e3eded;--shadow:0 1px 2px rgba(0,60,60,.06),0 6px 18px rgba(0,60,60,.06);
}
:root[data-theme="dark"]{
  --brand:#22c0b0;--brand2:#5fe3d3;--brand-ink:#7fe9dc;
  --bg:#071314;--grid:rgba(34,192,176,.06);--glow:rgba(34,192,176,.14);
  --surface:#0d1d1f;--surface2:#112628;--line:#1d3a3c;--text:#e3f3f2;--muted:#86a4a2;
  --red:#ff6b5e;--red-bg:#3b1513;--orange:#ff9a4d;--orange-bg:#3a210e;--amber:#f2c14e;--amber-bg:#33290b;--green:#43d692;--green-bg:#0d2c20;--gray:#8d99a8;--gray-bg:#222b37;
  --track:#173133;--shadow:0 0 0 1px rgba(34,192,176,.04);
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;background:var(--bg);
  background-image:radial-gradient(900px 400px at 85% -10%,var(--glow),transparent 70%),
   linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px;min-height:100vh}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1440px;margin:0 auto;padding:0 16px 40px}

.top{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{background:#f7f7f7;border-radius:12px;padding:4px 10px;display:flex;align-items:center;box-shadow:var(--shadow)}
.logo img{height:40px;display:block}
.tit{flex:1;min-width:200px}
.tit h1{margin:0;font:italic 800 22px "Exo 2",sans-serif;color:var(--brand-ink)}
.tit h1 span{color:var(--text);font-style:normal;font-weight:700}
.tit p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.live{display:flex;align-items:center;gap:8px;font:700 12px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--brand);border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:999px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--brand2);animation:ping 1.6s infinite}
.live.off{color:var(--red)} .live.off i{background:var(--red);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,192,176,.7)}100%{box-shadow:0 0 0 9px rgba(34,192,176,0)}}
.clock{text-align:right}
.clock b{font:700 26px "JetBrains Mono",monospace;display:block;line-height:1}
.clock small{font-size:11px;color:var(--muted)}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 9px;cursor:pointer;font:600 12px Inter,sans-serif}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:6px}
.tab{font:600 14px Inter,sans-serif;background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--brand-ink);border-bottom-color:var(--brand)}

.msg{padding:10px 14px;border-radius:10px;background:var(--red-bg);color:var(--red);font-weight:600;margin-top:12px}

.hud{display:grid;grid-template-columns:auto 1fr;gap:16px;margin:16px 0 8px;align-items:stretch}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.gauge .pct{font:800 30px "Exo 2",sans-serif;line-height:1}
.gauge .lb{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow);text-align:left;font:inherit;color:inherit}
button.st{cursor:pointer}
button.st[aria-pressed="true"]{outline:2px solid var(--c)}
.st::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--brand))}
.st .n{font:800 28px "Exo 2",sans-serif;line-height:1.1;color:var(--c,var(--text))}
.st .l{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:1000px){.hud{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
.bar .sp{flex:1}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font:600 12px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
input[type=search],select{font:13px Inter,sans-serif;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
input[type=search]{width:260px;max-width:100%}
.info{font-size:12px;color:var(--muted)}

.base{margin-top:22px}
.bh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.bh h2{margin:0;font:italic 800 19px "Exo 2",sans-serif;color:var(--brand-ink);display:flex;align-items:center;gap:8px}
.bh h2::before{content:"";width:10px;height:10px;border-radius:2px;background:linear-gradient(135deg,var(--brand),var(--brand2));transform:skewX(-14deg)}
.bh .sum{font-size:12px;color:var(--muted);font-weight:600}
.stack{flex:1;min-width:160px;max-width:420px;height:8px;border-radius:999px;overflow:hidden;display:flex;background:var(--track)}
.stack i{display:block;height:100%}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);overflow:hidden}
.card::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--k);opacity:.08;pointer-events:none}
.card.crit{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 18px -4px var(--red)}
.strip{margin:-12px -14px 0;padding:4px 14px;background:var(--red);color:#fff;font:700 11px "JetBrains Mono",monospace;letter-spacing:.08em}
.r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.frota{font:700 13px "JetBrains Mono",monospace;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.frota small{color:var(--muted);font-weight:500}
.badge{font:800 10px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--kb);color:var(--k);white-space:nowrap}
.nome{font-weight:700;font-size:15px;line-height:1.2}
.linha{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:space-between}
.mov{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;white-space:nowrap}
.mov.d{color:var(--brand)}
.mov svg{width:14px;height:14px}
.cd{font:700 22px "JetBrains Mono",monospace;color:var(--k);line-height:1}
.cd small{font:600 11px Inter,sans-serif;color:var(--muted);display:block;margin-bottom:3px;letter-spacing:.04em;text-transform:uppercase}
.r3{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;gap:8px}
.sig{display:inline-flex;align-items:flex-end;gap:1.5px;height:11px;margin-right:4px;vertical-align:-1px}
.sig b{width:3px;background:var(--track);border-radius:1px}
.sig b.on{background:var(--brand)}
.sig.bad b.on{background:var(--red)}
.bad{color:var(--red);font-weight:700}
.obs{font-size:11.5px;color:var(--k);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.nota{font-size:12px;color:var(--muted);margin-top:14px}

.tblc{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr td:first-child{box-shadow:inset 4px 0 var(--k)}
.foot{margin-top:28px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>
</head>

<script>
/* ===== CONFIGURAÇÃO DO PAINEL ONLINE ===== */
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzl19qpxppGY4FB5scTyG5GiOAwKJjsPt_tMHwAlNRGhaqocNT8PjGXEtNWUCq4QYUK/exec';   // URL do App da Web do Backend (termina em /exec)
/* ========================================= */
var API=(function(){
  var CHAVE=new URLSearchParams(location.search).get('k')||'';
  var cache=null,em=0,pend=null,lag=null,lagEm=0;
  function buscar(){
    if(cache&&Date.now()-em<20000) return Promise.resolve(cache);
    if(pend) return pend;
    pend=fetch(BACKEND_URL+(CHAVE?'?k='+encodeURIComponent(CHAVE):'')).then(function(r){return r.json();}).then(function(j){
      pend=null; if(j.erro) throw new Error(j.erro);
      cache=j; em=Date.now();
      lag=j.agoraRecebidoEm?(j.servidorEm-j.agoraRecebidoEm):null; lagEm=Date.now();
      return j;
    },function(e){pend=null;throw new Error('Não foi possível buscar os dados ('+e.message+').');});
    return pend;
  }
  return {
    agora:function(){return buscar().then(function(j){if(!j.agora) throw new Error('Ainda não chegaram dados do coletor.');return j.agora;});},
    dia:function(){return buscar().then(function(j){return j.dia;});},
    atraso:function(){return lag==null?(em?999:null):Math.round((lag+Date.now()-lagEm)/60000);}
  };
})();

</script>

    <div class="tblc" id="g2"><div class="empty">Carregando viagens…</div></div>
    <div class="nota" id="nota2"></div>
  </section>

  <div class="foot"><span>Fonte: ICS/Cittati (posição e motorista logado) · SME Prontos (último teste)</span><span>Atualização automática a cada 2 min</span></div>
</div>

<script>
var ORD={INAPTO:0,SEM_TESTE:1,VENCENDO:2,OK:3};
var LAB={INAPTO:'Inapto',SEM_TESTE:'Sem teste',VENCENDO:'Vence ≤ 2 h',OK:'Teste OK',NAO_AVALIADO:'Não avaliado'};
var K={INAPTO:['var(--red)','var(--red-bg)'],SEM_TESTE:['var(--orange)','var(--orange-bg)'],VENCENDO:['var(--amber)','var(--amber-bg)'],OK:['var(--green)','var(--green-bg)'],NAO_AVALIADO:['var(--gray)','var(--gray-bg)']};
var SEG=120, D1=null, D2=null, rec1=0, F1='TODOS', F2='', resta=SEG;

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function dur(m){m=Math.max(0,Math.round(m));var h=Math.floor(m/60),r=m%60;return h?h+'h'+String(r).padStart(2,'0'):r+'min';}
function hora(s){return s?String(s).slice(-5):'';}
function erro(e){$('msg').innerHTML='<div class="msg">'+esc(e&&e.message||e)+'</div>';}

/* ---------- tema (padrão claro) ---------- */
(function(){var t='light';try{t=localStorage.getItem('pv-tema')||'light';}catch(e){}document.documentElement.dataset.theme=t;})();
$('tema').onclick=function(){var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('pv-tema',r.dataset.theme);}catch(e){}};

/* ---------- abas ---------- */
function aba(n){
  $('v-agora').style.display=n==='agora'?'':'none'; $('v-dia').style.display=n==='dia'?'':'none';
  $('t-agora').setAttribute('aria-selected',n==='agora'); $('t-dia').setAttribute('aria-selected',n==='dia');
  if(n==='dia'&&!D2) carregar2();
}
$('t-agora').onclick=function(){aba('agora');}; $('t-dia').onclick=function(){aba('dia');};

function preencherBases(sel,D){
  var atual=sel.value,b={};(D||[]).forEach(function(l){if(l.base)b[l.base]=1;});
  sel.innerHTML='<option value="">Todas as bases</option>'+Object.keys(b).sort().map(function(x){return '<option'+(x===atual?' selected':'')+'>'+esc(x)+'</option>';}).join('');
}

/* ---------- Tela 1: rodando agora ---------- */
function carregar1(){
  API.agora().then(function(r){D1=r;rec1=Date.now();resta=SEG;$('msg').innerHTML='';tela1();})
    .catch(function(e){resta=SEG;erro(e);});
}
function situacao(l){
  if(l.cat==='OK'&&l.venceMin!=null&&vence(l)<=120) return 'VENCENDO';
  return l.cat;
}
function vence(l){return l.venceMin==null?null:l.venceMin-(Date.now()-rec1)/60000;}
var ICO={D:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8h9M8 4l4 4-4 4"/></svg>',
 P:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/></svg>',
 X:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v6M4.5 4.5a5 5 0 1 0 7 0"/></svg>'};
function movTxt(l){
  if(l.veloc>0) return '<span class="mov d">'+ICO.D+'Em movimento · '+l.veloc+' km/h</span>';
  if(l.ign) return '<span class="mov muted">'+ICO.P+'Parado · ignição ligada</span>';
  return '<span class="mov muted">'+ICO.X+'Ignição desligada</span>';
}
function sinal(l){
  var t=l.transMin; if(t==null) return '<span class="muted">sem transmissão</span>';
  var n=t<=2?4:t<=5?3:t<15?2:1, h=[4,6,8,11];
  return '<span title="Última transmissão '+esc(l.transmissao)+'"><span class="sig'+(t>=15?' bad':'')+'">'+h.map(function(x,i){return '<b style="height:'+x+'px" class="'+(i<n?'on':'')+'"></b>';}).join('')+'</span>'+
    '<span class="'+(t>=15?'bad':'')+'">'+(t<1?'agora':'há '+(t<60?t+' min':dur(t)))+'</span></span>';
}
function card(l){
  var s=situacao(l), k=K[s], crit=(s==='INAPTO'||s==='SEM_TESTE')&&l.veloc>0;
  var cd, cdl;
  if(s==='INAPTO'){cd='BLOQ.';cdl='não liberado';}
  else if(s==='SEM_TESTE'){cd='—';cdl=l.teste?'teste vencido':'sem registro';}
  else if(l.venceMin==null){cd='OK';cdl='validade';}
  else {cd=dur(vence(l));cdl='vence em';}
  return '<div class="card'+(crit?' crit':'')+'" style="--k:'+k[0]+';--kb:'+k[1]+'">'+
   (crit?'<div class="strip">⚠ EM MOVIMENTO SEM TESTE VÁLIDO</div>':'')+
   '<div class="r1"><span class="frota">'+esc(l.frota||'—')+' <small>'+esc(l.chapa||'')+'</small></span><span class="badge">'+LAB[s]+'</span></div>'+
   '<div><div class="nome">'+esc(l.motoristaICS)+'</div><div class="muted" style="font-size:12px">Matrícula '+esc(l.matricula)+'</div></div>'+
   '<div class="linha">'+movTxt(l)+'<span>'+esc(l.linha||'')+'</span></div>'+
   '<div class="cd"><small>'+cdl+'</small>'+cd+'</div>'+
   (l.detalhe&&s!=='OK'&&s!=='VENCENDO'?'<div class="obs">'+esc(l.detalhe)+'</div>':'')+
   '<div class="r3"><span>'+sinal(l)+'</span><span>'+(l.teste?'Teste <b class="mono">'+esc(hora(l.teste))+'</b> → <b class="mono">'+esc(hora(l.validade))+'</b>':'Sem teste registrado')+'</span></div>'+
  '</div>';
}
function ring(p){
  var r=31,c=2*Math.PI*r;
  $('ring').innerHTML='<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--brand2)"/></linearGradient></defs>'+
   '<circle cx="37" cy="37" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="8"/>'+
   '<circle cx="37" cy="37" r="'+r+'" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'" transform="rotate(-90 37 37)"/>';
}
function tela1(){
  if(!D1) return;
  var todas=D1.linhas.filter(function(l){return ORD[l.cat]!=null;});
  preencherBases($('base1'),todas);
  var base=$('base1').value, q=$('q1').value.trim().toUpperCase();
  var D=todas.filter(function(l){return !base||l.base===base;});
  var n=function(s){return D.filter(function(l){return situacao(l)===s;}).length;};
  var mv=D.filter(function(l){return l.veloc>0;}).length, val=n('OK')+n('VENCENDO');
  ring(D.length?val/D.length:0); $('pct').textContent=D.length?Math.round(val/D.length*100)+'%':'–';
  var S=[['Logados',D.length,'var(--brand)'],['Em movimento',mv,'var(--brand)'],['Parados',D.length-mv,'var(--muted)'],
    ['Inapto',n('INAPTO'),'var(--red)'],['Sem teste',n('SEM_TESTE'),'var(--orange)'],['Vence ≤ 2 h',n('VENCENDO'),'var(--amber)']];
  $('stats').innerHTML=S.map(function(x){return '<div class="st" style="--c:'+x[2]+'"><div class="n">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>';}).join('');
  var vis=D.filter(function(l){
    var s=situacao(l);
    if(F1==='ATENCAO'&&s==='OK') return false;
    if(F1==='MOV'&&!(l.veloc>0)) return false;
    return !q||(l.motoristaICS+' '+l.matricula+' '+l.frota+' '+l.chapa).toUpperCase().indexOf(q)>=0;
  }).sort(function(a,b){
    var sa=situacao(a),sb=situacao(b);
    return ORD[sa]-ORD[sb]||(a.veloc>0?0:a.ign?1:2)-(b.veloc>0?0:b.ign?1:2)||((vence(a)==null?1e9:vence(a))-(vence(b)==null?1e9:vence(b)))||String(a.frota).localeCompare(String(b.frota));
  });
  var bases=[];D.forEach(function(l){var b=l.base||'Sem base';if(bases.indexOf(b)<0)bases.push(b);});bases.sort();
  $('bases').innerHTML=!D.length?'<div class="empty">Nenhum motorista logado.</div>':bases.map(function(b){
    var all=D.filter(function(l){return (l.base||'Sem base')===b;}), L=vis.filter(function(l){return (l.base||'Sem base')===b;});
    var at=all.filter(function(l){return situacao(l)!=='OK';}).length;
    var st=['INAPTO','SEM_TESTE','VENCENDO','OK'].map(function(c){return '<i style="width:'+(all.filter(function(l){return situacao(l)===c;}).length/all.length*100)+'%;background:'+K[c][0]+'"></i>';}).join('');
    return '<section class="base"><div class="bh"><h2>'+esc(b)+'</h2><div class="stack" title="Distribuição por situação">'+st+'</div>'+
      '<span class="sum">'+all.length+' logados · <span style="color:'+(at?'var(--red)':'var(--green)')+'">'+at+' com atenção</span></span></div>'+
      '<div class="grid">'+(L.map(card).join('')||'<span class="muted">Nada neste filtro.</span>')+'</div></section>';
  }).join('');
  var ni=D1.linhas.filter(function(l){return l.cat==='NAO_IDENTIFICADO';});
  $('nota1').textContent=ni.length?ni.length+' login(s) sem matrícula identificada no cadastro (ex.: '+ni.slice(0,3).map(function(l){return l.motoristaICS;}).join(', ')+') não entram na contagem.':'';
}
document.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){F1=b.dataset.f;document.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===b);});tela1();};});
$('q1').oninput=tela1; $('base1').onchange=tela1;

/* ---------- Tela 2: viagens finalizadas ---------- */
function carregar2(){
  API.dia().then(function(r){D2=r;tela2();}).catch(erro);
}
function tela2(){
  if(!D2) return;
  preencherBases($('base2'),D2.linhas);
  var base=$('base2').value, q=$('q2').value.trim().toUpperCase();
  var D=D2.linhas.filter(function(l){return !base||l.base===base;});
  var n=function(c){return D.filter(function(l){return l.cat===c;}).length;};
  var S=[['Viagens finalizadas','',D.length,'var(--brand)'],['Teste OK','OK',n('OK'),'var(--green)'],['Sem teste','SEM_TESTE',n('SEM_TESTE'),'var(--orange)'],['Inapto','INAPTO',n('INAPTO'),'var(--red)']];
  $('stats2').innerHTML=S.map(function(x){return '<button class="st" data-c="'+x[1]+'" aria-pressed="'+(F2===x[1])+'" style="--c:'+x[3]+'"><div class="n">'+x[2]+'</div><div class="l">'+x[0]+'</div></button>';}).join('');
  $('stats2').querySelectorAll('button').forEach(function(b){b.onclick=function(){F2=(F2===b.dataset.c?'':b.dataset.c);tela2();};});
  $('info2').textContent=D2.ultimaColeta?'Atualizado '+D2.ultimaColeta:'';
  var rows=D.filter(function(l){
    if(F2&&l.cat!==F2) return false;
    return !q||(l.motorista+' '+l.matricula+' '+l.linha+' '+l.itinerario+' '+l.frota).toUpperCase().indexOf(q)>=0;
  }).sort(function(a,b){return (ORD[a.cat]==null?9:ORD[a.cat])-(ORD[b.cat]==null?9:ORD[b.cat]);});
  $('g2').innerHTML=!rows.length?'<div class="empty">'+(D2.linhas.length?'Nenhuma viagem com esse filtro.':'Nenhuma viagem finalizada gravada hoje.')+'</div>':
    '<table><thead><tr><th>Teste</th><th>Motorista</th><th>Viagem</th><th>Veículo</th><th>Partida</th><th>Chegada</th><th>Teste do motorista</th></tr></thead><tbody>'+
    rows.map(function(l){
      var k=K[l.cat]||K.NAO_AVALIADO;
      return '<tr style="--k:'+k[0]+';--kb:'+k[1]+'"><td><span class="badge">'+esc(LAB[l.cat]||l.cat)+'</span>'+(l.detalhe?'<div class="obs" style="margin-top:4px">'+esc(l.detalhe)+'</div>':'')+'</td>'+
        '<td><div class="nome" style="font-size:14px">'+esc(l.motorista)+'</div><div class="muted mono" style="font-size:12px">Mat. '+esc(l.matricula)+'</div></td>'+
        '<td><div>'+esc(l.linha)+'</div><div class="muted" style="font-size:12px">'+esc(l.itinerario)+(l.sentido?' · '+esc(l.sentido):'')+(l.base?' · '+esc(l.base):'')+'</div></td>'+
        '<td><span class="frota">'+esc(l.frota||'—')+'</span></td>'+
        '<td class="mono">'+esc(l.partidaTxt||hora(l.partida)||'—')+'</td>'+
        '<td class="mono">'+esc(l.chegada||'—')+'</td>'+
        '<td class="mono">'+esc(l.teste||'—')+(l.validade?'<div class="muted" style="font-size:12px">válido até '+esc(l.validade)+'</div>':'')+'</td></tr>';
    }).join('')+'</tbody></table>';
  var na=n('NAO_AVALIADO'), notas=[];
  if(na) notas.push(na+' viagem(ns) ainda sem avaliação de teste');
  if(D2.semMotorista) notas.push(D2.semMotorista+' viagem(ns) sem motorista identificado no ICS');
  $('nota2').textContent=notas.join(' · ');
}
$('q2').oninput=tela2; $('base2').onchange=tela2;

/* ---------- relógio, status e atualização ---------- */
function tique(){
  $('clk').textContent=new Date().toLocaleTimeString('pt-BR');
  resta--;
  var at=API.atraso();   // minutos desde a última coleta (null = desconhecido)
  var off=at!=null&&at>10;
  $('live').className='live'+(off?' off':''); $('live').lastChild.textContent=off?'SEM DADOS NOVOS':'AO VIVO';
  if(off&&!$('msg').innerHTML) $('msg').innerHTML='<div class="msg">Os dados não são atualizados há '+at+' min. O coletor pode estar desligado.</div>';
  if(D1) $('upd').textContent='dados de '+String(D1.atualizadoEm).slice(11,16)+' · próxima em '+Math.max(resta,0)+' s';
  if(resta<=0){resta=SEG;carregar1();if($('v-dia').style.display!=='none')carregar2();}
}
setInterval(function(){if(D1)tela1();},30000);
carregar1(); tique(); setInterval(tique,1000);
</script>
</body>
</html>
